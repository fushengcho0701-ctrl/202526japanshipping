<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>船班訂艙追蹤系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="app-header-main">
            <div class="app-logo">🚢</div>
            <div>
                <div class="app-title">船班訂艙追蹤系統</div>
                <div class="app-subtitle">行事曆全螢幕監控版</div>
            </div>
        </div>
        <div class="app-header-meta">
            <div class="lang-toggle">
                <button class="lang-btn active" data-lang="zh">中</button>
                <button class="lang-btn" data-lang="ja">日</button>
            </div>
        </div>
    </header>

    <main class="app-main">
        <section id="calendar-view" class="view active">
            <div class="card">
                <div class="card-controls">
                    <div class="controls-left">
                        <div class="calendar-nav">
                            <button class="btn" id="btn-prev-period">＜</button>
                            <span class="calendar-period-label" id="period-label">載入中...</span>
                            <button class="btn" id="btn-next-period">＞</button>
                            <button class="btn btn-ghost" id="btn-today">今天</button>
                        </div>
                    </div>
                    <div class="controls-right">
                        <div class="calendar-tabs">
                            <button class="subtab-button active" data-cal-view="month">月視圖</button>
                            <button class="subtab-button" data-cal-view="week">週視圖</button>
                            <button class="subtab-button" data-cal-view="sailing-only">只看開船</button>
                        </div>
                    </div>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
            </div>
        </section>
    </main>

    <div class="modal-backdrop" id="detail-modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">船班詳情</div>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <dl id="modal-detail-list"></dl>
            </div>
        </div>
    </div>

    <script>
        // 自動對接你提供的 Google Sheet 連結 (CSV 匯出格式)
        window.SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1ni-_d9dyMXszc7C1UvnRplXasceSTUcx6_vsId7RQgM/export?format=csv&gid=0";
    </script>
    <script src="script.js"></script>
</body>
</html>
