<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>船班監控戰情室 v4.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <span class="logo">🚢</span>
            <div>
                <h1>船班訂艙與檢疫追蹤</h1>
                <p>專業監控版 (最大化佈局)</p>
            </div>
        </div>
        <div class="header-right">
            <div class="view-tabs">
                <button class="tab-btn active" data-target="calendar-view">行事曆網格</button>
                <button class="tab-btn" data-target="table-view">列表清單</button>
            </div>
            <input type="text" id="search-input" placeholder="搜尋船名/港口...">
        </div>
    </header>

    <main class="app-main">
        <section id="calendar-view" class="view active">
            <div class="calendar-controls">
                <div class="nav-group">
                    <button id="btn-prev" class="btn">＜</button>
                    <span id="period-label">加載中...</span>
                    <button id="btn-next" class="btn">＞</button>
                    <button id="btn-today" class="btn">今天</button>
                </div>
                <div class="sub-tabs">
                    <button class="sub-btn active" data-mode="month">月視圖</button>
                    <button class="sub-btn" data-mode="week">週視圖</button>
                    <button class="sub-btn" data-mode="sailing">只看開船</button>
                </div>
            </div>
            <div id="calendar-grid" class="calendar-grid"></div>
        </section>

        <section id="table-view" class="view">
            <div class="card table-section">
                <h2 class="section-title">正在進行中 (未到港)</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>船班</th><th>櫃次</th><th>開船時間</th><th>抵達港口</th><th>預計抵達</th><th>SO 狀態</th><th>電放單</th>
                            </tr>
                        </thead>
                        <tbody id="active-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card table-section collapsed-section">
                <details>
                    <summary>📁 已到港船班 (點擊展開歷史記錄)</summary>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>船班</th><th>櫃次</th><th>開船時間</th><th>抵達港口</th><th>抵達日</th><th>SO 狀態</th><th>電放單</th>
                                </tr>
                            </thead>
                            <tbody id="history-tbody"></tbody>
                        </table>
                    </div>
                </details>
            </div>
        </section>
    </main>

    <div id="modal-backdrop" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script>
        // 對接您提供的 Google Sheet 匯出路徑
        window.SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1ni-_d9dyMXszc7C1UvnRplXasceSTUcx6_vsId7RQgM/export?format=csv&gid=0";
    </script>
    <script src="script.js"></script>
</body>
</html>
