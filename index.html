<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>船班訂艙監控系統 v2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="logo-area">
                <span class="logo-icon">🚢</span>
                <div>
                    <h1>船班訂艙與檢疫追蹤</h1>
                    <p>專業監控版 (最大化佈局)</p>
                </div>
            </div>
            <div class="nav-controls">
                <div class="calendar-nav">
                    <button id="btn-prev" class="btn-nav">＜</button>
                    <span id="period-label">加載中...</span>
                    <button id="btn-next" class="btn-nav">＞</button>
                    <button id="btn-today" class="btn-today">今天</button>
                </div>
                <div class="view-switcher">
                    <button class="view-btn active" data-view="month">月視圖</button>
                    <button class="view-btn" data-view="week">週視圖</button>
                    <button class="view-btn" data-view="sailing">只看開船</button>
                </div>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div id="calendar-grid" class="calendar-grid">
            </div>
    </main>

    <div id="modal-backdrop" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">船班資訊</h2>
                <button id="modal-close">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script>
        // 對接你提供的 Google Sheet
        window.SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1ni-_d9dyMXszc7C1UvnRplXasceSTUcx6_vsId7RQgM/export?format=csv&gid=0";
    </script>
    <script src="script.js"></script>
</body>
</html>
